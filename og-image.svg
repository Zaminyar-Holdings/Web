<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f4ede0"/>

  <!-- Subtle warm vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="#f4ede0" stop-opacity="0"/>
    <stop offset="100%" stop-color="#c9bea4" stop-opacity="0.18"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Top horizontal hairline -->
  <line x1="60" y1="60" x2="1140" y2="60" stroke="#0d0a07" stroke-width="1" opacity="0.25"/>
  <line x1="60" y1="570" x2="1140" y2="570" stroke="#0d0a07" stroke-width="1" opacity="0.25"/>

  <!-- Eyebrow text top-left -->
  <text x="60" y="92"
        font-family="DM Mono, ui-monospace, monospace"
        font-size="14"
        font-weight="500"
        fill="#7a6b58"
        letter-spacing="3">PROPERTY-BACKED WEALTH INFRASTRUCTURE</text>

  <!-- Folio top-right -->
  <text x="1140" y="92"
        font-family="DM Mono, ui-monospace, monospace"
        font-size="14"
        font-weight="500"
        fill="#7a6b58"
        text-anchor="end"
        letter-spacing="2">ZAMINYAR.CO.UK</text>

  <!-- Wordmark — Zaminyar -->
  <text x="600" y="290"
        font-family="Fraunces, Georgia, 'Times New Roman', serif"
        font-size="140"
        font-weight="400"
        text-anchor="middle"
        fill="#0d0a07"
        letter-spacing="-3">Zaminyar</text>

  <!-- Hairline rule under wordmark -->
  <line x1="540" y1="320" x2="660" y2="320" stroke="#0d0a07" stroke-width="1" opacity="0.55"/>

  <!-- HOLDINGS subtitle -->
  <text x="600" y="358"
        font-family="DM Mono, ui-monospace, monospace"
        font-size="22"
        font-weight="500"
        text-anchor="middle"
        fill="#0d0a07"
        letter-spacing="9"
        opacity="0.85">HOLDINGS</text>

  <!-- Tagline -->
  <text x="600" y="475"
        font-family="Fraunces, Georgia, 'Times New Roman', serif"
        font-size="40"
        font-weight="300"
        font-style="italic"
        text-anchor="middle"
        fill="#4a3f33"
        letter-spacing="-0.3">Build Autonomous Wealth Through Buy-to-Let</text>
</svg>
